[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazeagent"
version = "0.1.0"
description = "Amaze on Work — Autonomous Incident-to-Fix Agent on Amazon Bedrock AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents >= 1.15.0",
    "networkx >= 3.0",
    "httpx >= 0.25.0",
    "pydantic >= 2.0.0",
    "python-dotenv >= 1.0.0",
    "jinja2 >= 3.1.0",
    "langchain-core >= 0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
